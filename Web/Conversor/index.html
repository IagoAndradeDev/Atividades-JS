<!DOCTYPE html>
<html lang="pt_BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de moeda</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
        <div class="container-conversor">
            <div class="title">
                <h1>Conversor de moedas</h1>
            </div>
            <div class="moeda-reais">
                <label>Converter de </label>
                <select>
                    <option value="Reais">R$ Real Brasileiro</option>
                </select>
            </div>
            <div class="moeda-conversao">
                <label>Converter para</label>
                <select>
                    <option value="Dolar">$ Dólar Americano</option>
                    <option value="Euro">€ Euro</option>
                    <option value="Libra">£ Libra</option>
                    <option value="Bitcoin">₿ Bitcoin</option>
                </select>
            </div>
            <div class="converter">
                <label>Valor</label>
                <input type="number" placeholder="R$ 10.000,00">
                <button>Converter</button>
            </div>
            <div class="resultado-conversao">
                <div class="real">
                    <img src="img/brasil.png" alt="imagem">
                    <h1>Real</h1>
                    <p>R$ 0,00</p>
                </div>
                <div class="convertido">
                    <img src="img/eua.png" alt="imagem">
                    <h1>Dólar Americano</h1>
                    <p>US$ 0,00</p>
                </div>
            </div>
        </div>
    </main>
<script src="script.js"></script>
</body>
</html>
